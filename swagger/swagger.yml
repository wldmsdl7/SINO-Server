openapi: 3.0.0
info:
  title: SINO
  version: 1.0.0
  description: "의미있는 신호(SIGNAL)는 남기고, 불필요한 잡음(NOISE)은 줄이자"

servers:
  - description: "로컬 서버"
    url: http://localhost:3000
  - description: "배포 서버"
    url: http://3.34.200.244:3000

paths:
  paths:
  /api/v1/auth/signup:
    post:
      summary: 회원가입
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                  description: 닉네임 (unique)
              required:
                - nickname
      responses:
        "200":
          description: 회원가입 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
        "409":
          description: 이미 존재하는 사용자
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  statusCode:
                    type: integer
                  message:
                    type: string
        "500":
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  statusCode:
                    type: integer
                  message:
                    type: string
  /api/v1/auth/login:
    post:
      summary: 로그인
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                  description: 로그인할 닉네임
              required:
                - nickname
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                      token:
                        type: string
        "404":
          description: 존재하지 않는 사용자
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  statusCode:
                    type: integer
                  message:
                    type: string
        "500":
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  statusCode:
                    type: integer
                  message:
                    type: string
  /api/v1/auth/check:
    get:
      summary: 닉네임 중복 확인
      tags:
        - Auth
      parameters:
        - in: query
          name: nickname
          required: true
          schema:
            type: string
          description: 확인할 닉네임
      responses:
        "200":
          description: 닉네임 중복 확인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      isAvailable:
                        type: boolean
                        description: 닉네임 사용 가능 여부 (`true` = 사용 가능, `false` = 사용 불가)
        "500":
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  statusCode:
                    type: integer
                  message:
                    type: string
